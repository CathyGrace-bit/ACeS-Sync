
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACeS Sync - ACLC Mandaue | Login</title>

    <!-- CSS FILES -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/feature.css">

    <style>
        .hidden {
            display: none !important;
        }

        .page {
            width: 100%;
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <!-- LOGIN PAGE -->

    <section id="loginPage" class="page login-wrap">

        <!-- LEFT BRANDING PANEL -->
        <div class="login-brand">
            <div class="brand-content">

                <div class="school-logo">
                    <img src="image.jpg" alt="ACLC College Mandaue Logo">
                </div>

                <h2>ACLC MANDAUE</h2>
                <h1>ACeS Sync</h1>

                <p class="tagline">
                    Connecting Students &amp; Administration
                </p>

                <div class="gold-line">
                    <span>∞</span>
                </div>

                <p class="features">
                    Secure <span>•</span>
                    Efficient <span>•</span>
                    Organized
                </p>

            </div>

            <p class="copyright">
                © 2026 ACLC Mandaue City
            </p>
        </div>


        <!-- RIGHT LOGIN PANEL -->
        <div class="login-panel">

            <div class="login-panel-inner">

                <div class="login-heading">
                    <h1>Login Dashboard</h1>

                    <p>
                        Access the ACeS Sync system.
                        Choose your login type to continue.
                    </p>
                </div>


                <!-- LOGIN TABS -->
                <div class="login-tabs">

                    <button
                        type="button"
                        class="tab active"
                        onclick="showLogin('student')">
                        🎓 Student Login
                    </button>

                    <button
                        type="button"
                        class="tab"
                        onclick="showLogin('admin')">
                        🛡️ Admin / Cashier
                    </button>

                </div>


                <!-- STUDENT LOGIN FORM -->
                <div id="studentLogin" class="login-form">

                    <h2>Student Login</h2>

                    <div class="form-row">
                        <label for="studentId">Student ID</label>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="Enter Student ID"
                            autocomplete="username">
                    </div>

                    <div class="form-row">
                        <label for="studentNameLogin">Full Name</label>

                        <input
                            type="text"
                            id="studentNameLogin"
                            placeholder="Enter Full Name">
                    </div>

                    <div class="form-row">
                        <label for="studentYear">Grade / Year</label>

                        <select id="studentYear">
                            <option value="">Select Grade / Year</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="studentCourseLogin">Course</label>

                        <select id="studentCourseLogin">
                            <option value="">Select Course</option>
                            <option>BSIT</option>
                            <option>BSCS</option>
                            <option>BSBA</option>
                            <option>BSA</option>
                            <option>BSHM</option>
                            <option>ABM</option>
                            <option>HUMSS</option>
                            <option>STEM</option>
                            <option>Home economics</option>
                            <option>IA EPAS (Electronics)</option>
                            <option>ICT Animation</option>
                            <option>ICT Programming</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="studentSection">Section</label>

                        <input
                            type="text"
                            id="studentSection"
                            placeholder="Example: 3A">
                    </div>

                    <button
                        type="button"
                        class="primary-btn full-btn"
                        onclick="studentLogin()">

                        <span>➜</span>
                        Login as Student
                    </button>

                    <p
                        id="studentLoginMessage"
                        class="message"
                        aria-live="polite">
                    </p>

                </div>


                <!-- ADMIN / CASHIER LOGIN FORM -->
                <div id="adminLogin" class="login-form hidden">

                    <h2>Admin / Cashier Login</h2>

                    <div class="form-row">
                        <label for="adminId">Admin name/ID</label>

                        <input
                            type="text"
                            id="adminId"
                            placeholder="Enter Admin ID"
                            autocomplete="username">
                    </div>

                    <div class="form-row">
                        <label for="adminPassword">Password</label>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter Password"
                            autocomplete="current-password">
                    </div>

                    <button
                        type="button"
                        class="primary-btn full-btn"
                        onclick="adminLogin()">

                        <span>➜</span>
                        Login as Admin / Cashier
                    </button>

                    <p
                        id="adminLoginMessage"
                        class="message"
                        aria-live="polite">
                    </p>

                    <p class="demo-note">
                        Demo login:
                        <strong>admin</strong> /
                        <strong>1234</strong>
                    </p>

                </div>

            </div>
        </div>

    </section>


    <!-- JAVASCRIPT FILES -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/Script.js" defer></script>

</body>
</html>
