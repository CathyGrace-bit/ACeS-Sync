
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACeS Sync - ACLC Mandaue | Login</title>

    <!-- LOGIN CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <main id="loginPage" class="login-wrap">

        <!-- LEFT BRANDING PANEL -->
        <section class="login-brand">

            <!-- GOLD DECORATIVE NETWORK LINES -->
            <svg class="gold-network"
                 viewBox="0 0 700 500"
                 preserveAspectRatio="xMidYMid slice"
                 aria-hidden="true">

                <g fill="none"
                   stroke="#d9a441"
                   stroke-width="1.5"
                   opacity="0.55">

                    <path d="M0 350 L120 250 L240 310 L360 180 L500 230 L700 90"/>
                    <path d="M0 420 L150 320 L280 390 L420 260 L560 320 L700 210"/>
                    <path d="M60 500 L180 390 L310 450 L460 340 L610 400 L700 340"/>
                    <path d="M120 0 L220 100 L340 50 L460 150 L580 80 L700 160"/>

                </g>

                <g fill="#d9a441" opacity="0.8">
                    <circle cx="120" cy="250" r="4"/>
                    <circle cx="240" cy="310" r="4"/>
                    <circle cx="360" cy="180" r="4"/>
                    <circle cx="500" cy="230" r="4"/>
                    <circle cx="150" cy="320" r="4"/>
                    <circle cx="420" cy="260" r="4"/>
                    <circle cx="560" cy="320" r="4"/>
                    <circle cx="340" cy="50" r="4"/>
                    <circle cx="460" cy="150" r="4"/>
                </g>

            </svg>

            <div class="brand-content">

                <div class="school-logo">
                    <img src="image.jpg"
                         alt="ACLC College Mandaue Logo">
                </div>

                <h2>ACLC MANDAUE</h2>

                <h1>ACeS Sync</h1>

                <p class="tagline">
                    Connecting Students &amp; Administration
                </p>

                <!-- GOLD DECORATIVE DIVIDER -->
                <div class="gold-line">
                    <span class="gold-line-side"></span>
                    <span class="gold-line-center">◆</span>
                    <span class="gold-line-side"></span>
                </div>

                <p class="features">
                    Secure <span>•</span>
                    Efficient <span>•</span>
                    Organized
                </p>

            </div>

            <p class="copyright">
                © 2026 ACLC Mandaue City
            </p>

        </section>


        <!-- RIGHT LOGIN PANEL -->
        <section class="login-panel">

            <div class="login-panel-inner">

                <div class="login-heading">

                    <h1>Login Dashboard</h1>

                    <p>
                        Access the ACeS Sync system.
                        Choose your login type to continue.
                    </p>

                </div>


                <!-- LOGIN TABS -->
                <div class="login-tabs">

                    <button
                        type="button"
                        id="studentTab"
                        class="tab active"
                        aria-selected="true"
                        onclick="showLogin('student')">

                        🎓 Student Login

                    </button>

                    <button
                        type="button"
                        id="adminTab"
                        class="tab"
                        aria-selected="false"
                        onclick="showLogin('admin')">

                        🛡️ Admin / Cashier

                    </button>

                </div>


                <!-- STUDENT LOGIN FORM -->
                <div id="studentLogin" class="login-form">

                    <h2>Student Login</h2>

                    <div class="form-row">
                        <label for="studentId">Student ID</label>

                        <input
                            type="text"
                            id="studentId"
                            placeholder="Enter Student ID"
                            autocomplete="username">
                    </div>

                    <div class="form-row">
                        <label for="studentNameLogin">Full Name</label>

                        <input
                            type="text"
                            id="studentNameLogin"
                            placeholder="Enter Full Name">
                    </div>

                    <div class="form-row">
                        <label for="studentYear">Grade / Year</label>

                        <select id="studentYear">
                            <option value="">Select Grade / Year</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="studentCourseLogin">Course</label>

                        <select id="studentCourseLogin">
                            <option value="">Select Course</option>
                            <option>BSIT</option>
                            <option>BSCS</option>
                            <option>BSBA</option>
                            <option>BSA</option>
                            <option>BSHM</option>
                            <option>ABM</option>
                            <option>HUMSS</option>
                            <option>STEM</option>
                            <option>Home economics</option>
                            <option>IA EPAS (Electronics)</option>
                            <option>ICT Animation</option>
                            <option>ICT Programming</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="studentSection">Section</label>

                        <input
                            type="text"
                            id="studentSection"
                            placeholder="Example: 3A">
                    </div>

                    <button
                        type="button"
                        class="primary-btn full-btn"
                        onclick="studentLogin()">

                        <span>➜</span>
                        Login as Student

                    </button>

                    <p
                        id="studentLoginMessage"
                        class="message"
                        aria-live="polite">
                    </p>

                </div>


                <!-- ADMIN / CASHIER LOGIN FORM -->
                <div id="adminLogin" class="login-form hidden">

                    <h2>Admin / Cashier Login</h2>

                    <div class="form-row">
                        <label for="adminId">Admin name/ID</label>

                        <input
                            type="text"
                            id="adminId"
                            placeholder="Enter Admin ID"
                            autocomplete="username">
                    </div>

                    <div class="form-row">
                        <label for="adminPassword">Password</label>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter Password"
                            autocomplete="current-password">
                    </div>

                    <button
                        type="button"
                        class="primary-btn full-btn"
                        onclick="adminLogin()">

                        <span>➜</span>
                        Login as Admin / Cashier

                    </button>

                    <p
                        id="adminLoginMessage"
                        class="message"
                        aria-live="polite">
                    </p>

                    <p class="demo-note">
                        Demo login:
                        <strong>admin</strong> /
                        <strong>1234</strong>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script src="js/login.js" defer></script>

</body>
</html>
